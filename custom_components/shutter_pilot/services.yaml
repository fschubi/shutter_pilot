open_group:
  name: Gruppe öffnen
  description: >-
    Öffnet alle Rollläden eines Bereichs. Ohne Bereich gilt der Dienst für alle
    Bereiche – also für das ganze Haus.
  fields:
    area_id:
      name: Bereich-ID
      description: >-
        Optional. ID des Bereichs (z. B. living, schlafzimmer, kueche). Leer
        lassen für alle Bereiche.
      required: false
      selector:
        text:

close_group:
  name: Gruppe schließen
  description: >-
    Schließt alle Rollläden eines Bereichs. Ohne Bereich gilt der Dienst für
    alle Bereiche – also für das ganze Haus.
  fields:
    area_id:
      name: Bereich-ID
      description: >-
        Optional. ID des Bereichs (z. B. living, schlafzimmer, kueche). Leer
        lassen für alle Bereiche.
      required: false
      selector:
        text:

stop_group:
  name: Gruppe anhalten
  description: >-
    Hält alle fahrenden Rollläden und Markisen eines Bereichs an. Ohne Bereich
    gilt der Dienst für alle Bereiche – also für das ganze Haus.
  fields:
    area_id:
      name: Bereich-ID
      description: >-
        Optional. ID des Bereichs (z. B. living, schlafzimmer, kueche). Leer
        lassen für alle Bereiche.
      required: false
      selector:
        text:

sun_protect_group:
  name: Sonnenschutz Gruppe
  description: >-
    Fährt alle Rollläden eines Bereichs in Sonnenschutz-Position. Ohne Bereich
    gilt der Dienst für alle Bereiche.
  fields:
    area_id:
      name: Bereich-ID
      description: >-
        Optional. ID des Bereichs (z. B. living, schlafzimmer, kueche). Leer
        lassen für alle Bereiche.
      required: false
      selector:
        text:

ventilate_group:
  name: Gruppe lüften
  description: >-
    Fährt alle Rollläden eines Bereichs in die Lüftungsposition, also auf die
    Position, die auch bei gekipptem Fenster angefahren wird. Ohne Bereich gilt
    der Dienst für alle Bereiche.
  fields:
    area_id:
      name: Bereich-ID
      description: >-
        Optional. ID des Bereichs (z. B. living, schlafzimmer, kueche). Leer
        lassen für alle Bereiche.
      required: false
      selector:
        text:


retract_awnings:
  name: Markisen einfahren
  description: >-
    Fährt alle Markisen sofort ein – ohne Staffelung und ohne den globalen
    Mindestabstand, gedacht für eine angekündigte Sturmwarnung. Ohne Bereich
    gilt der Dienst für das ganze Haus.
  fields:
    area_id:
      name: Bereich-ID
      description: >-
        Optional. Nur die Markisen dieses Beschattungsbereichs einfahren.
      required: false
      selector:
        text:

resume_automation:
  name: Automatik wieder übernehmen
  description: >-
    Gibt Rollläden zurück an die Automatik, nachdem sie von aussen gefahren
    wurden – etwa durch einen eigenen Schalter oder eine eigene Automation.
    Löscht die manuelle Übersteuerung und fährt sofort auf die Position, die
    gerade gilt: die Beschattungshöhe, wenn beschattet werden soll, sonst
    offen oder geschlossen je nach Tageshälfte. Ohne Angaben gilt der Dienst
    für alle Bereiche.
  fields:
    entity_id:
      name: Rollladen
      description: >-
        Optional. Eine oder mehrere Cover-Entitäten. Leer lassen für alle
        Rollläden des Bereichs.
      required: false
      selector:
        entity:
          domain: cover
          multiple: true
    area_id:
      name: Bereich-ID
      description: >-
        Optional. ID des Bereichs (z. B. living, kinderzimmer). Leer lassen
        für alle Bereiche.
      required: false
      selector:
        text:
