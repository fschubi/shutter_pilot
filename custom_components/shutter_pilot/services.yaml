open_group:
  name: Gruppe öffnen
  description: Öffnet alle Rollläden des angegebenen Bereichs.
  fields:
    area_id:
      name: Bereich-ID
      description: ID des Bereichs (z. B. living, schlafzimmer, kueche).
      selector:
        text:

close_group:
  name: Gruppe schließen
  description: Schließt alle Rollläden des angegebenen Bereichs.
  fields:
    area_id:
      name: Bereich-ID
      description: ID des Bereichs (z. B. living, schlafzimmer, kueche).
      selector:
        text:

sun_protect_group:
  name: Sonnenschutz Gruppe
  description: Fährt alle Rollläden des Bereichs in Sonnenschutz-Position.
  fields:
    area_id:
      name: Bereich-ID
      description: ID des Bereichs (z. B. living, schlafzimmer, kueche).
      selector:
        text:

ventilate_group:
  name: Gruppe lüften
  description: >-
    Fährt alle Rollläden des Bereichs in die Lüftungsposition, also auf die
    Position, die auch bei gekipptem Fenster angefahren wird.
  fields:
    area_id:
      name: Bereich-ID
      description: ID des Bereichs (z. B. living, schlafzimmer, kueche).
      selector:
        text:


retract_awnings:
  name: Markisen einfahren
  description: >-
    Fährt alle Markisen sofort ein – ohne Staffelung und ohne den globalen
    Mindestabstand, gedacht für eine angekündigte Sturmwarnung. Ohne Bereich
    gilt der Dienst für das ganze Haus.
  fields:
    area_id:
      name: Bereich-ID
      description: >-
        Optional. Nur die Markisen dieses Beschattungsbereichs einfahren.
      required: false
      selector:
        text:
